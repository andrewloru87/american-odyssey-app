<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wanna">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Turn 'we should do something' into an actual plan.">
<title>Wanna</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23171717'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-size='55' font-family='Arial,sans-serif' font-weight='800' fill='white'%3EW%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f7f5;--surface:#fff;--text:#171717;--muted:#73736e;--line:#e7e7e1;--accent:#ff625d;--soft:#ffe9e6;--ok:#ddf5e7;--warn:#fff2c7;--shadow:0 8px 28px rgba(20,20,20,.055);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{overscroll-behavior-y:none}.app{width:min(480px,100%);min-height:100dvh;margin:auto;background:var(--bg);position:relative;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(94px + env(safe-area-inset-bottom))}.screen{display:none;animation:in .18s ease}.screen.active{display:block}@keyframes in{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.date,.eyebrow{font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}h1{font-size:34px;letter-spacing:-1.4px;line-height:1.04;margin:9px 0 20px}h2{font-size:20px;letter-spacing:-.35px;margin:0}p{margin:7px 0 13px}.muted{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.card.compact{padding:15px 16px}.heading{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 7px}.heading h2{font-size:21px}.btn{appearance:none;border:0;border-radius:999px;padding:12px 17px;background:#171717;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.btn:active{transform:scale(.985)}.btn.soft{background:var(--soft);color:var(--text)}.btn.ghost{background:#efefeb;color:var(--text)}.btn.block{width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill,.chip{display:inline-flex;align-items:center;gap:6px;border:0;padding:8px 11px;border-radius:999px;background:#f0f0ec;font-size:12px;font-weight:800;color:#555}.chip{padding:10px 14px;font-size:13px;cursor:pointer}.chip.active{background:#171717;color:#fff}.status{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:10px;letter-spacing:.06em;font-weight:900;background:#efefeb}.status.ready{background:var(--warn)}.status.confirmed{background:var(--ok)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.tab{border:0;background:none;font-weight:750;font-size:11px;color:#8a8a86;cursor:pointer}.tab b{display:block;font-size:22px;line-height:24px;font-weight:600}.tab.active{color:#171717}.hero{min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(155deg,#fff,#fff0ed);overflow:hidden}.hero .emoji{font-size:78px;margin-bottom:auto}.score{font-weight:900;font-size:12px;color:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:15px 0}.match{background:#171717;color:white;border-color:#171717}.match .muted,.match .eyebrow{color:#b8b8b3}.match .btn.soft{background:white}.input{width:100%;border:1px solid transparent;outline:none;background:#f2f2ee;border-radius:18px;padding:14px;font:inherit;font-size:16px;color:var(--text)}textarea.input{min-height:105px;resize:none}.input:focus{border-color:#ccc}.people-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.person{border:1px solid var(--line);background:white;border-radius:18px;padding:13px 8px;text-align:center;font-weight:800;cursor:pointer}.person.active{background:#171717;color:#fff}.avatar{width:42px;height:42px;margin:0 auto 7px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:17px}.person.active .avatar{background:#333}.stack{display:grid;gap:9px}.planline{display:flex;align-items:center;gap:12px}.planemoji{width:48px;height:48px;flex:0 0 48px;border-radius:16px;background:#f1f1ed;display:grid;place-items:center;font-size:25px}.plantext{min-width:0;flex:1}.plantext h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;padding:28px 16px;color:var(--muted)}.install{background:#171717;color:white;border-radius:22px;padding:14px 15px;margin:0 0 16px;display:flex;gap:12px;align-items:center}.install.hidden{display:none}.install p{margin:2px 0 0;color:#c9c9c6;font-size:12px}.install button{margin-left:auto;background:#2d2d2d;color:#fff;border:0;border-radius:999px;width:30px;height:30px;font-weight:900}.profile{display:flex;align-items:center;justify-content:space-between}.profile-avatar{width:70px;height:70px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:28px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat b{font-size:26px;display:block}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{aspect-ratio:1;border-radius:20px;background:white;border:1px solid var(--line);display:grid;place-items:center;font-size:33px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:var(--bg);width:min(480px,100%);max-height:92dvh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.15)}.handle{width:42px;height:5px;background:#d4d4cf;border-radius:99px;margin:0 auto 18px}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#171717;color:#fff;padding:11px 15px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:90;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.chooser{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:24px}.chooser.hidden{display:none}.chooser-inner{width:min(420px,100%)}.logo{width:72px;height:72px;background:#171717;color:#fff;border-radius:23px;display:grid;place-items:center;font-weight:900;font-size:32px;margin-bottom:28px}.mini{font-size:12px}
@media(min-width:700px){body{background:#ecece8}.app{box-shadow:0 0 70px rgba(0,0,0,.08)}.tabbar{box-shadow:0 -6px 20px rgba(0,0,0,.03)}}
</style>
</head>
<body>
<div class="chooser" id="chooser"><div class="chooser-inner"><div class="logo">W</div><div class="eyebrow">Wanna preview</div><h1>Who are you?</h1><p class="muted">Choose a profile for this device. This preview stores data only on this phone.</p><div class="people-grid"><button class="person" onclick="pickUser('Andreas')"><div class="avatar">A</div>Andreas</button><button class="person" onclick="pickUser('Benny')"><div class="avatar">B</div>Benny</button><button class="person" onclick="pickUser('Mokya')"><div class="avatar">M</div>Mokya</button></div></div></div>
<div class="app">
<div class="install" id="installTip"><div>📱</div><div><b>Add Wanna to Home</b><p>Safari → Share → Add to Home Screen</p></div><button onclick="dismissInstall()">×</button></div>
<section class="screen active" id="home"></section>
<section class="screen" id="discover"></section>
<section class="screen" id="create"></section>
<section class="screen" id="plans"></section>
<section class="screen" id="you"></section>
</div>
<nav class="tabbar"><button class="tab active" data-target="home"><b>⌂</b>Home</button><button class="tab" data-target="discover"><b>✦</b>Discover</button><button class="tab" data-target="create"><b>＋</b>Create</button><button class="tab" data-target="plans"><b>◫</b>Plans</button><button class="tab" data-target="you"><b>◎</b>You</button></nav>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><div id="sheetContent"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='wanna-preview-v021';
const cards=[
{id:'shiki',emoji:'🍣',score:94,title:'Try Shiki',subtitle:'Japanese · Vienna · €€€',reason:'You and Benny both rate Japanese food highly.',interested:['Benny']},
{id:'bowling',emoji:'🎳',score:88,title:'Bowling night',subtitle:'Activity · 2–4 people',reason:'Benny and Mokya are interested too.',interested:['Benny','Mokya']},
{id:'schneeberg',emoji:'🏔️',score:84,title:'Schneeberg day trip',subtitle:'Outdoor · full day',reason:'Saved before and fits your weekend preferences.',interested:['Mokya']},
{id:'cocktails',emoji:'🍸',score:82,title:'Cocktails somewhere new',subtitle:'Drinks · Vienna',reason:'A low-effort plan that fits your recent evenings.',interested:['Benny']}
];
const seedPlans=[
{id:'sushi',title:'Sushi night',emoji:'🍣',status:'PLANNING',people:['Andreas','Benny'],when:'Friday · 19:30',place:'KitchA',vote:null},
{id:'prague',title:'Prague weekend',emoji:'✈️',status:'READY_TO_CONFIRM',people:['Andreas','Benny','Mokya'],when:'23–25 October',place:'Prague',vote:'YES'},
{id:'prater',title:'Prater after work',emoji:'🎡',status:'CONFIRMED',people:['Andreas','Mokya'],when:'Tomorrow · 18:30',place:'Prater',vote:'YES'}
];
let state=load();let discoverIndex=state.discoverIndex||0;let pendingDiscover=null;let selectedPeople=new Set();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{user:null,plans:seedPlans,decisions:{},discoverIndex:0,installDismissed:false}}catch(e){return{user:null,plans:seedPlans,decisions:{},discoverIndex:0,installDismissed:false}}}
function save(){state.discoverIndex=discoverIndex;localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pickUser(name){state.user=name;save();document.getElementById('chooser').classList.add('hidden');renderAll();toast('Hi '+name+' 👋')}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.target===id));if(id==='create')renderCreate();if(id==='plans')renderPlans();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.target));
function fmtDate(){return new Intl.DateTimeFormat('en',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}
function planCard(p,action=true){const statusClass=p.status==='READY_TO_CONFIRM'?'ready':p.status==='CONFIRMED'?'confirmed':'';return `<div class="card compact" onclick="openPlan('${p.id}')"><div class="planline"><div class="planemoji">${p.emoji}</div><div class="plantext"><div class="status ${statusClass}">${p.status.replaceAll('_',' ')}</div><h2>${esc(p.title)}</h2><div class="muted mini">${esc(p.people.join(' · '))}${p.when?' · '+esc(p.when):''}</div></div>${action?'<div>›</div>':''}</div></div>`}
function renderHome(){const needs=state.plans.filter(p=>p.status==='PLANNING'||p.status==='READY_TO_CONFIRM');const upcoming=state.plans.filter(p=>p.status==='CONFIRMED');document.getElementById('home').innerHTML=`<div class="top"><div class="date">${fmtDate()}</div><div class="pill">Local demo</div></div><h1>Good morning,<br>${esc(state.user||'friend')}</h1><div class="card"><div class="eyebrow">Quick start</div><h2>What do you wanna do?</h2><p class="muted">Start with an idea, a person, a date or a place.</p><button class="btn" onclick="event.stopPropagation();show('create')">＋ Create something</button></div><div class="heading"><h2>Needs you</h2><span>${needs.length}</span></div>${needs.length?needs.map(p=>planCard(p)).join(''):'<div class="card empty">Nothing waiting on you. Nice.</div>'}<div class="heading"><h2>For you</h2></div><div class="card"><div class="eyebrow">✨ Good window</div><h2>Make something happen</h2><p class="muted">Turn a loose idea into a plan in a few taps.</p><button class="btn soft" onclick="show('create')">Make a plan</button></div>${upcoming.length?'<div class="heading"><h2>Upcoming</h2></div>'+upcoming.map(p=>planCard(p)).join(''):''}`}
function renderDiscover(){const c=cards[discoverIndex%cards.length];const match=state.lastMatch?cards.find(x=>x.id===state.lastMatch):null;document.getElementById('discover').innerHTML=`<div class="top"><div><div class="eyebrow">Private until mutual</div><h1 style="margin-bottom:5px">Discover</h1></div><div>⚙</div></div><p class="muted">Things you might actually wanna do.</p>${match?`<div class="card match"><div class="eyebrow">It's a match ✨</div><h2>${match.emoji} ${esc(match.title)}</h2><p class="muted">${esc(match.interested.join(' & '))} ${match.interested.length===1?'wants':'want'} this too.</p><button class="btn soft" onclick="startFromDiscover('${match.id}')">Create Plan</button></div>`:''}<div class="card hero"><div class="emoji">${c.emoji}</div><div class="score">${c.score}% FOR YOU</div><h1 style="margin:4px 0">${esc(c.title)}</h1><div>${esc(c.subtitle)}</div><p class="muted">${esc(c.reason)}</p></div><div class="actions"><button class="btn ghost" onclick="decide('PASS')">Pass</button><button class="btn soft" onclick="decide('SAVE')">Save</button><button class="btn" onclick="decide('WANNA')">Wanna</button></div>`}
function decide(d){const c=cards[discoverIndex%cards.length];state.decisions[c.id]=d;if(d==='WANNA'&&c.interested.length){state.lastMatch=c.id;toast("It's a match ✨")}else if(d==='SAVE')toast('Saved for later');else if(d==='PASS')toast('Passed');discoverIndex=(discoverIndex+1)%cards.length;save();renderDiscover()}
function startFromDiscover(id){pendingDiscover=cards.find(c=>c.id===id)||null;selectedPeople=new Set(pendingDiscover?.interested||[]);show('create')}
function renderCreate(){const p=pendingDiscover;const people=['Andreas','Benny','Mokya'].filter(x=>x!==state.user);document.getElementById('create').innerHTML=`<div class="eyebrow">New plan</div><h1>Create</h1><p class="muted">Start anywhere. Wanna asks only for what is missing.</p><div class="card"><label class="eyebrow">What are you thinking?</label><textarea id="planTitle" class="input" placeholder="Sushi Friday…">${p?esc(p.title):''}</textarea><div style="height:13px"></div><label class="eyebrow">With who?</label><div class="people-grid" style="margin-top:9px">${people.map(name=>`<button id="person-${name}" class="person ${selectedPeople.has(name)?'active':''}" onclick="togglePerson('${name}')"><div class="avatar">${name[0]}</div>${name}</button>`).join('')}</div><div style="height:15px"></div><label class="eyebrow">When?</label><div class="row" style="margin-top:9px"><button class="chip" data-when="Tonight" onclick="selectWhen(this)">Tonight</button><button class="chip" data-when="Tomorrow" onclick="selectWhen(this)">Tomorrow</button><button class="chip" data-when="This weekend" onclick="selectWhen(this)">This weekend</button><button class="chip active" data-when="Decide later" onclick="selectWhen(this)">Decide later</button></div><div style="height:15px"></div><button class="btn block" onclick="createPlan()">Create plan</button></div><div class="card"><h2>Or start with…</h2><p class="muted">People, date, place or a link.</p><div class="row"><span class="chip">👥 People</span><span class="chip">🗓 Date</span><span class="chip">📍 Place</span><span class="chip">🔗 Link</span></div></div>`;window.selectedWhen='Decide later'}
function togglePerson(name){selectedPeople.has(name)?selectedPeople.delete(name):selectedPeople.add(name);document.getElementById('person-'+name)?.classList.toggle('active',selectedPeople.has(name))}
function selectWhen(el){document.querySelectorAll('[data-when]').forEach(x=>x.classList.remove('active'));el.classList.add('active');window.selectedWhen=el.dataset.when}
function createPlan(){const title=document.getElementById('planTitle').value.trim();if(!title){toast('Give the plan a name');return}const when=window.selectedWhen||'Decide later';const plan={id:'plan-'+Date.now(),title,emoji:pendingDiscover?.emoji||'✨',status:when==='Decide later'?'IDEA':'PLANNING',people:[state.user,...selectedPeople].filter(Boolean),when:when==='Decide later'?'':when,place:pendingDiscover?.subtitle?.split(' · ')[1]||'',vote:null};state.plans.unshift(plan);pendingDiscover=null;selectedPeople=new Set();save();renderAll();openPlan(plan.id);toast('Plan created')}
function renderPlans(){const groups=['IDEA','PLANNING','READY_TO_CONFIRM','CONFIRMED'];document.getElementById('plans').innerHTML=`<div class="eyebrow">Everything in motion</div><h1>Plans</h1>${groups.map(g=>{const list=state.plans.filter(p=>p.status===g);if(!list.length)return'';return `<div class="heading"><h2>${g==='IDEA'?'Ideas':g==='PLANNING'?'Planning':g==='READY_TO_CONFIRM'?'Ready to confirm':'Confirmed'}</h2><span>${list.length}</span></div>${list.map(p=>planCard(p)).join('')}`}).join('')}`}
function renderYou(){document.getElementById('you').innerHTML=`<div class="profile"><div><div class="eyebrow">Your profile</div><h1 style="margin-bottom:3px">${esc(state.user||'You')}</h1><div class="muted">@${esc((state.user||'you').toLowerCase())}</div></div><div class="profile-avatar">${esc((state.user||'Y')[0])}</div></div><div class="card"><div class="eyebrow">Your preview</div><div class="stats"><div class="stat"><b>${state.plans.length}</b><span>plans</span></div><div class="stat"><b>${Object.values(state.decisions).filter(v=>v==='WANNA').length}</b><span>wannas</span></div><div class="stat"><b>${Object.values(state.decisions).filter(v=>v==='SAVE').length}</b><span>saved</span></div></div></div><div class="heading"><h2>Memories</h2></div><div class="photoGrid"><div class="photo">🍣</div><div class="photo">✈️</div><div class="photo">🎡</div><div class="photo">🍸</div><div class="photo">🏔️</div><div class="photo">🎬</div></div><div class="card"><div class="eyebrow">Preview note</div><h2>Data stays on this device</h2><p class="muted">The shared Supabase backend comes next. For now this is perfect for testing the flow and interface.</p><button class="btn ghost" onclick="resetDemo()">Reset this demo</button></div>`}
function openPlan(id){const p=state.plans.find(x=>x.id===id);if(!p)return;const ready=p.status==='READY_TO_CONFIRM';const confirmed=p.status==='CONFIRMED';document.getElementById('sheetContent').innerHTML=`<div class="eyebrow">${p.status.replaceAll('_',' ')}</div><h1>${p.emoji} ${esc(p.title)}</h1><div class="card"><div class="eyebrow">People</div><h2>${esc(p.people.join(' · '))}</h2>${p.when?`<p class="muted">🗓 ${esc(p.when)}</p>`:''}${p.place?`<p class="muted">📍 ${esc(p.place)}</p>`:''}</div>${!confirmed?`<div class="card"><div class="eyebrow">Your vote</div><h2>Does this work?</h2><div class="actions"><button class="btn ${p.vote==='NO'?'':'ghost'}" onclick="votePlan('${p.id}','NO')">No</button><button class="btn ${p.vote==='MAYBE'?'':'soft'}" onclick="votePlan('${p.id}','MAYBE')">Maybe</button><button class="btn" onclick="votePlan('${p.id}','YES')">Yes</button></div></div>`:''}<button class="btn block ${confirmed?'ghost':''}" onclick="advancePlan('${p.id}')">${confirmed?'Confirmed ✓':ready?'Confirm plan':'Ready to confirm'}</button><div style="height:9px"></div><button class="btn ghost block" onclick="closeSheet()">Close</button>`;document.getElementById('overlay').classList.add('show')}
function votePlan(id,v){const p=state.plans.find(x=>x.id===id);if(!p)return;p.vote=v;save();openPlan(id);renderAll();toast('Vote saved: '+v)}
function advancePlan(id){const p=state.plans.find(x=>x.id===id);if(!p)return;if(p.status==='CONFIRMED'){closeSheet();return}p.status=p.status==='READY_TO_CONFIRM'?'CONFIRMED':'READY_TO_CONFIRM';save();openPlan(id);renderAll();toast(p.status==='CONFIRMED'?'Plan confirmed 🎉':'Ready to confirm')}
function closeSheet(){document.getElementById('overlay').classList.remove('show')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1900)}
function dismissInstall(){state.installDismissed=true;save();document.getElementById('installTip').classList.add('hidden')}
function resetDemo(){localStorage.removeItem(KEY);location.reload()}
function renderAll(){renderHome();renderDiscover();renderCreate();renderPlans();renderYou();document.getElementById('installTip').classList.toggle('hidden',!!state.installDismissed)}
if(state.user)document.getElementById('chooser').classList.add('hidden');renderAll();
</script>
</body>
</html>
